<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Items</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>customers List</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody id="itemList"></tbody>
    </table>

    <script>
        // Fetch registered customers from the server and render them safely.
        // Values are inserted with textContent (not innerHTML) to avoid XSS
        // from user-supplied sign-up data.
        fetch('/api/customers', { credentials: 'same-origin' })
            .then(response => {
                if (!response.ok) throw new Error('HTTP ' + response.status);
                return response.json();
            })
            .then(data => {
                const itemList = document.getElementById('itemList');
                itemList.innerHTML = '';

                if (!Array.isArray(data) || data.length === 0) {
                    const tr = document.createElement('tr');
                    const td = document.createElement('td');
                    td.colSpan = 2;
                    td.textContent = 'No customers registered yet.';
                    tr.appendChild(td);
                    itemList.appendChild(tr);
                    return;
                }

                data.forEach(item => {
                    const tr = document.createElement('tr');

                    const nameCell = document.createElement('td');
                    const nameStrong = document.createElement('strong');
                    nameStrong.textContent = item.username || '';
                    nameCell.appendChild(nameStrong);

                    const emailCell = document.createElement('td');
                    emailCell.textContent = item.email || '';

                    tr.appendChild(nameCell);
                    tr.appendChild(emailCell);
                    itemList.appendChild(tr);
                });
            })
            .catch(error => {
                console.error('Error fetching customers:', error);
                const itemList = document.getElementById('itemList');
                itemList.innerHTML = '';
                const tr = document.createElement('tr');
                const td = document.createElement('td');
                td.colSpan = 2;
                td.textContent = 'Could not load customers. Is the server running?';
                tr.appendChild(td);
                itemList.appendChild(tr);
            });
    </script>
</body>
</html>
